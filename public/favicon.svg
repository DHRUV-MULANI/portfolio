<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- Shield Border Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Metallic Core Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Container: Deep Cyber Obsidian with Rounded Corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M64 16 L102 30 V62 C102 87 84 105 64 112 C44 105 26 87 26 62 V30 Z" 
        stroke="url(#neonCyan)" 
        stroke-width="3" 
        stroke-linejoin="round"
        fill="#080C14" 
        fill-opacity="0.85"
        filter="url(#glow)"/>

  <!-- Inner Security Core Matrix Grid Accents -->
  <path d="M64 24 V104" stroke="#00F5D4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M38 64 H90" stroke="#00F5D4" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Stylized High-Tech Monogram: DM (Dhruv Mulani) -->
  <!-- 'D' Glyph (Offensive Terminal Shield Left) -->
  <path d="M42 42 H54 C62 42 67 47 67 56 C67 65 62 70 54 70 H42 V42 Z M48 48 V64 H53 C57 64 61 61 61 56 C61 51 57 48 53 48 H48 Z" 
        fill="url(#coreGlow)"/>

  <!-- 'M' Glyph (Symmetric Cyber Angles Right) -->
  <path d="M69 70 V42 H76 L82 54 L88 42 H95 V70 H89 V53 L83 65 H81 L75 53 V70 H69 Z" 
        fill="url(#neonCyan)"/>

  <!-- Micro Radar Status Dot -->
  <circle cx="64" cy="92" r="3.5" fill="#00F5D4"/>
  <circle cx="64" cy="92" r="7" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
